# Bare-metal PVC version (K8sRules) — requires local-path-provisioner:
#   kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/master/deploy/local-path-storage.yaml
#
# Every DaemonSet from secscan-local.yaml becomes a StatefulSet with
# podAntiAffinity (one pod per node, by hostname) + volumeClaimTemplates.
# replicas:3 below is a placeholder for a 3-node cluster -- adjust to your
# actual node count. secscan-scanner keeps its emptyDir (no durable state,
# identical across all four modes, PRD §16).

apiVersion: v1
kind: Namespace
metadata:
  name: secscan
  labels:
    name: secscan

---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: secscan-local-storage
provisioner: rancher.io/local-path
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer

---

# secscan-vnet: was DaemonSet, now StatefulSet with anti-affinity for one-per-node
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: secscan
  name: secscan-vnet
  labels:
    app: secscan-vnet
spec:
  serviceName: secscan-vnet
  replicas: 3
  selector:
    matchLabels:
      app: secscan-vnet
  template:
    metadata:
      labels:
        app: secscan-vnet
    spec:
      hostNetwork: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: secscan-vnet
              topologyKey: kubernetes.io/hostname
      containers:
        - name: secscan-vnet
          image: saichler/secscan-vnet:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 33005
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: secscan-local-storage
        resources:
          requests:
            storage: 5Gi

---

