<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#0ea5e9">
    <title>Vulnerabilities Doctor</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="../l8ui/images/logo.gif">
    <link rel="apple-touch-icon" href="../l8ui/images/logo.gif">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .splash { text-align: center; color: white; }
        .splash-logo { width: 80px; height: 80px; margin-bottom: 24px; }
        .splash-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .splash-subtitle { font-size: 14px; opacity: 0.9; margin-bottom: 32px; }
        .loader {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="splash">
        <img src="../l8ui/images/logo.gif" alt="Vulnerabilities Doctor" class="splash-logo">
        <h1 class="splash-title">Vulnerabilities Doctor</h1>
        <p class="splash-subtitle">Container Image Vulnerability Management</p>
        <div class="loader"></div>
    </div>

    <script>
        // Default this project to the Noir Monochrome theme (l8ui, shared
        // across projects) unless the user already picked a different one.
        if (!localStorage.getItem('layer8d-theme')) {
            localStorage.setItem('layer8d-theme', 'noir');
        }
        const token = sessionStorage.getItem('bearerToken') || localStorage.getItem('bearerToken');
        setTimeout(function() {
            if (!token) {
                window.location.href = '../l8ui/login/';
            } else {
                window.location.href = 'app.html';
            }
        }, 500);
    </script>
</body>
</html>
