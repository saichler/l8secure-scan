# Local mode (K8sRules): hostPath volumes, DirectoryOrCreate. DaemonSet for
# per-node workloads, Deployment for the scalable scanner, StatefulSet for
# the stateful backend. secscan-scanner owns no durable/customer state (PRD
# §16) so it always uses an emptyDir, identical across all four modes.

apiVersion: v1
kind: Namespace
metadata:
  name: secscan
  labels:
    name: secscan

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: secscan
  name: secscan-vnet
  labels:
    app: secscan-vnet
spec:
  selector:
    matchLabels:
      app: secscan-vnet
  template:
    metadata:
      labels:
        app: secscan-vnet
    spec:
      hostNetwork: true
      containers:
        - name: secscan-vnet
          image: saichler/secscan-vnet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 33005
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: secscan
  name: secscan-log-vnet
  labels:
    app: secscan-log-vnet
spec:
  selector:
    matchLabels:
      app: secscan-log-vnet
  template:
    metadata:
      labels:
        app: secscan-log-vnet
    spec:
      hostNetwork: true
      containers:
        - name: secscan-log-vnet
          image: saichler/secscan-log-vnet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 33010
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: secscan
  name: secscan
  labels:
    app: secscan
spec:
  serviceName: secscan
  replicas: 1
  selector:
    matchLabels:
      app: secscan
  template:
    metadata:
      labels:
        app: secscan
    spec:
      containers:
        - name: secscan
          image: saichler/secscan:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate

---

# secscan-scanner (PRD §13/§16): stateless worker, single replica for v1,
# no durable state -- emptyDir Trivy-DB cache only (§13.2), identical
# across all four modes. TRIVY_CACHE_DIR is a real Trivy CLI env var
# (verified public Trivy documentation) -- no scanner code change needed to
# make it use the mounted cache dir.
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: secscan
  name: secscan-scanner
  labels:
    app: secscan-scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secscan-scanner
  template:
    metadata:
      labels:
        app: secscan-scanner
    spec:
      containers:
        - name: secscan-scanner
          image: saichler/secscan-scanner:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: TRIVY_CACHE_DIR
              value: /data
          volumeMounts:
            - name: trivy-cache
              mountPath: /data
      volumes:
        - name: trivy-cache
          emptyDir: {}

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: secscan
  name: secscan-web
  labels:
    app: secscan-web
spec:
  selector:
    matchLabels:
      app: secscan-web
  template:
    metadata:
      labels:
        app: secscan-web
    spec:
      hostNetwork: true
      containers:
        - name: secscan-web
          image: saichler/secscan-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 2790
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  namespace: secscan
  name: secscan-log-agent
  labels:
    app: secscan-log-agent
spec:
  selector:
    matchLabels:
      app: secscan-log-agent
  template:
    metadata:
      labels:
        app: secscan-log-agent
    spec:
      containers:
        - name: secscan-log-agent
          image: saichler/secscan-log-agent:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LOGPATH
              value: /data/logs/secscan
            - name: LOGFILE
              value: "*"
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
      volumes:
        - name: hdata
          hostPath:
            path: /data
            type: DirectoryOrCreate
