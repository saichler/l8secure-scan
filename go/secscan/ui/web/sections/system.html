<div class="section-container l8-section">
    <!-- Header with Parallax Effect -->
    <div class="l8-header-frame parallax-container">
        <!-- Background Illustration Layer -->
        <div class="l8-header-bg parallax-layer" data-speed="0.5">
            <svg class="l8-illustration" viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="sysGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:var(--layer8d-primary);stop-opacity:0.4" />
                        <stop offset="100%" style="stop-color:var(--layer8d-primary-dark);stop-opacity:0.2" />
                    </linearGradient>
                </defs>

                <!-- Grid Background -->
                <g opacity="0.1">
                    <line x1="0" y1="30" x2="1200" y2="30" stroke="var(--layer8d-primary)" stroke-width="0.5"/>
                    <line x1="0" y1="60" x2="1200" y2="60" stroke="var(--layer8d-primary)" stroke-width="0.5"/>
                    <line x1="0" y1="90" x2="1200" y2="90" stroke="var(--layer8d-primary)" stroke-width="0.5"/>
                    <line x1="200" y1="0" x2="200" y2="120" stroke="var(--layer8d-primary)" stroke-width="0.5"/>
                    <line x1="400" y1="0" x2="400" y2="120" stroke="var(--layer8d-primary)" stroke-width="0.5"/>
                    <line x1="600" y1="0" x2="600" y2="120" stroke="var(--layer8d-primary)" stroke-width="0.5"/>
                    <line x1="800" y1="0" x2="800" y2="120" stroke="var(--layer8d-primary)" stroke-width="0.5"/>
                    <line x1="1000" y1="0" x2="1000" y2="120" stroke="var(--layer8d-primary)" stroke-width="0.5"/>
                </g>

                <!-- Security Icons -->
                <g class="people-animation">
                    <!-- Lock Icon -->
                    <rect x="185" y="50" width="30" height="25" rx="3" fill="url(#sysGradient1)" opacity="0.6"/>
                    <path d="M 192,50 L 192,42 A 8,8 0 0 1 208,42 L 208,50" fill="none" stroke="url(#sysGradient1)" stroke-width="3" opacity="0.5"/>

                    <!-- Shield Icon -->
                    <path d="M 400,35 L 420,30 L 440,35 L 440,55 C 440,70 420,80 420,80 C 420,80 400,70 400,55 Z" fill="url(#sysGradient1)" opacity="0.5"/>
                    <path d="M 415,55 L 420,60 L 430,48" fill="none" stroke="var(--layer8d-on-primary, #fff)" stroke-width="2" opacity="0.6"/>

                    <!-- Key Icon -->
                    <circle cx="600" cy="55" r="12" fill="url(#sysGradient1)" opacity="0.6"/>
                    <circle cx="600" cy="55" r="5" fill="none" stroke="var(--layer8d-on-primary, #fff)" stroke-width="2" opacity="0.4"/>
                    <line x1="605" y1="55" x2="625" y2="55" stroke="url(#sysGradient1)" stroke-width="3" opacity="0.6"/>
                    <line x1="620" y1="55" x2="620" y2="62" stroke="url(#sysGradient1)" stroke-width="3" opacity="0.6"/>

                    <!-- User/Gear Icon -->
                    <circle cx="800" cy="48" r="8" fill="url(#sysGradient1)" opacity="0.5"/>
                    <path d="M 785,75 C 785,60 815,60 815,75" fill="url(#sysGradient1)" opacity="0.4"/>

                    <!-- Server Icon -->
                    <rect x="975" y="40" width="50" height="15" rx="3" fill="url(#sysGradient1)" opacity="0.6"/>
                    <rect x="975" y="58" width="50" height="15" rx="3" fill="url(#sysGradient1)" opacity="0.5"/>
                    <circle cx="985" cy="47" r="2" fill="var(--layer8d-on-primary, #fff)" opacity="0.5"/>
                    <circle cx="985" cy="65" r="2" fill="var(--layer8d-on-primary, #fff)" opacity="0.5"/>
                </g>

                <!-- Connection Lines -->
                <path d="M 215,55 Q 310,40 400,50" fill="none" stroke="var(--layer8d-primary)" stroke-width="1" opacity="0.3"/>
                <path d="M 440,55 Q 520,70 588,55" fill="none" stroke="var(--layer8d-primary)" stroke-width="1" opacity="0.3"/>
                <path d="M 625,55 Q 710,45 785,55" fill="none" stroke="var(--layer8d-primary)" stroke-width="1" opacity="0.3"/>
                <path d="M 815,60 Q 890,75 975,55" fill="none" stroke="var(--layer8d-primary)" stroke-width="1" opacity="0.3"/>

                <!-- Animated Dots -->
                <circle cx="310" cy="48" r="3" fill="var(--layer8d-primary)" opacity="0.8">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="710" cy="50" r="3" fill="var(--layer8d-primary)" opacity="0.8">
                    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
                </circle>
            </svg>
        </div>

        <!-- Header Content Layer -->
        <div class="l8-header-content parallax-layer" data-speed="1">
            <div class="l8-header-title">
                <div class="l8-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.98 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.98a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.22.63.8 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg></div>
                <div>
                    <h1 class="l8-title">System Administration</h1>
                    <p class="l8-subtitle">Security & System Management</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Module Tabs -->
    <div class="l8-module-tabs">
        <button class="l8-module-tab active" data-module="health">
            <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 8-4-16-3 8H2"/></svg></span>
            <span class="tab-label">Health</span>
        </button>
        <button class="l8-module-tab" data-module="security">
            <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <span class="tab-label">Security</span>
        </button>
        <button class="l8-module-tab" data-module="modules">
            <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.44 7.85a1.13 1.13 0 0 0 .23.7l1.25 1.26c.38.37.56.87.56 1.36s-.19.99-.56 1.36l-1.29 1.29a.78.78 0 0 1-.67.22c-.38-.06-.64-.38-.78-.74a2 2 0 1 0-2.57 2.57c.36.14.68.4.74.78a.78.78 0 0 1-.22.67l-1.29 1.29c-.38.38-.87.56-1.36.56s-.99-.18-1.36-.56l-1.26-1.25a.82.82 0 0 0-.7-.23c-.4.06-.68.4-.82.78a2 2 0 1 1-2.59-2.59c.37-.14.72-.42.78-.82a.82.82 0 0 0-.23-.7L4.02 10.4A1.92 1.92 0 0 1 3.46 9c0-.5.19-.99.56-1.36L5.3 6.36a.79.79 0 0 1 .67-.22c.38.06.64.38.78.74a2 2 0 1 0 2.57-2.57c-.36-.14-.68-.4-.74-.78a.78.78 0 0 1 .22-.67L9.9 1.57C10.28 1.19 10.77 1 11.27 1s.98.19 1.36.56l1.25 1.26c.19.19.44.27.7.23.4-.06.68-.4.82-.78a2 2 0 1 1 2.59 2.59c-.37.14-.72.42-.78.82Z"/></svg></span>
            <span class="tab-label">Modules</span>
        </button>
        <button class="l8-module-tab" data-module="logs">
            <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></span>
            <span class="tab-label">Logs</span>
        </button>
    </div>

    <div class="section-content">
        <!-- Health Module -->
        <div class="l8-module-content active" data-module="health">
            <div class="l8-table-container" id="health-table-container"></div>
        </div>

        <!-- Security Module -->
        <div class="l8-module-content" data-module="security">
            <nav class="l8-subnav">
                <a class="l8-subnav-item active" data-service="users"><span class="subnav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span class="subnav-label">Users</span></a>
                <a class="l8-subnav-item" data-service="roles"><span class="subnav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg></span><span class="subnav-label">Roles</span></a>
                <a class="l8-subnav-item" data-service="credentials"><span class="subnav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></svg></span><span class="subnav-label">Credentials</span></a>
            </nav>
            <div class="l8-service-content">
                <div class="l8-service-view active" data-service="users">
                    <div class="l8-table-container" id="security-users-table-container"></div>
                </div>
                <div class="l8-service-view" data-service="roles">
                    <div class="l8-table-container" id="security-roles-table-container"></div>
                </div>
                <div class="l8-service-view" data-service="credentials">
                    <div class="l8-table-container" id="security-credentials-table-container"></div>
                </div>
            </div>
        </div>

        <!-- Modules Module -->
        <div class="l8-module-content" data-module="modules">
            <div class="l8-service-content" style="overflow-y:auto;">
                <div id="modules-settings-container"></div>
            </div>
        </div>

        <!-- Logs Module -->
        <div class="l8-module-content" data-module="logs">
            <div class="l8-table-container" id="logs-table-container"></div>
        </div>
    </div>
</div>

    if (typeof initializeL8Sys === 'function') {
        initializeL8Sys();

</script>
