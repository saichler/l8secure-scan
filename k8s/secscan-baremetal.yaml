---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: secscan
  name: secscan
  labels:
    app: secscan
spec:
  serviceName: secscan
  replicas: 1
  selector:
    matchLabels:
      app: secscan
  template:
    metadata:
      labels:
        app: secscan
    spec:
      containers:
        - name: secscan
          image: saichler/secscan:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: secscan-local-storage
        resources:
          requests:
            storage: 5Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: secscan
  name: secscan-scanner
  labels:
    app: secscan-scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secscan-scanner
  template:
    metadata:
      labels:
        app: secscan-scanner
    spec:
      containers:
        - name: secscan-scanner
          image: saichler/secscan-scanner:latest
          imagePullPolicy: Always
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: TRIVY_CACHE_DIR
              value: /data
          volumeMounts:
            - name: trivy-cache
              mountPath: /data
      volumes:
        - name: trivy-cache
          emptyDir: {}

---

