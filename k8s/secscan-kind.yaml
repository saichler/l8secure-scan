# KIND mode (K8sRules): same shape as bare-metal, but no custom
# StorageClass -- KIND ships its own default "standard" provisioner.
#
# Every DaemonSet from secscan-local.yaml becomes a StatefulSet with
# podAntiAffinity (one pod per node, by hostname) + volumeClaimTemplates.
# replicas:1 below matches kind-start.sh's 1 control-plane (tainted
# NoSchedule) + 1 worker cluster -- a strict one-per-node anti-affinity
# StatefulSet can't schedule more replicas than schedulable nodes.
# secscan-scanner keeps its emptyDir (no durable state, identical across
# all four modes, PRD §16).

apiVersion: v1
kind: Namespace
metadata:
  name: secscan
  labels:
    name: secscan

---

# secscan-vnet: was DaemonSet, now StatefulSet with anti-affinity for one-per-node
apiVersion: apps/v1
kind: StatefulSet
metadata:
  namespace: secscan
  name: secscan-vnet
  labels:
    app: secscan-vnet
spec:
  serviceName: secscan-vnet
  replicas: 1
  selector:
    matchLabels:
      app: secscan-vnet
  template:
    metadata:
      labels:
        app: secscan-vnet
    spec:
      hostNetwork: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: secscan-vnet
              topologyKey: kubernetes.io/hostname
      containers:
        - name: secscan-vnet
          image: saichler/secscan-vnet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 33005
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          volumeMounts:
            - name: hdata
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: hdata
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi

---

